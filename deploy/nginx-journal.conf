# The Local Edit — nginx
#
# Two hostnames, two upstreams, no overlap:
#
#   journal.localbalivillas.com      → public site        :3000
#   news-studio.localbalivillas.com  → review panel       :4100
#
# The panel is deliberately NOT reachable from the public hostname. Even if
# this file were misconfigured, the panel refuses any Host header outside
# ADMIN_ALLOWED_HOSTS, so a stray vhost cannot expose it.
#
# Install:
#   sudo cp deploy/nginx-journal.conf /etc/nginx/sites-available/journal
#   sudo ln -s /etc/nginx/sites-available/journal /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d journal.localbalivillas.com -d news-studio.localbalivillas.com
#   sudo nginx -t && sudo systemctl reload nginx

# --------------------------------------------------------------------------
# Public site
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name journal.localbalivillas.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name journal.localbalivillas.com;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/journal.localbalivillas.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/journal.localbalivillas.com/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hashed asset filenames — safe to cache hard.
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# --------------------------------------------------------------------------
# Review panel — separate hostname, locked down
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name news-studio.localbalivillas.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name news-studio.localbalivillas.com;

    # ssl_certificate     /etc/letsencrypt/live/news-studio.localbalivillas.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/news-studio.localbalivillas.com/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Nothing here should ever be indexed, even if a link leaks.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Optional second lock: restrict to the addresses you actually publish
    # from. Uncomment and list your office/home/VPN IPs.
    # allow 203.0.113.10;
    # allow 198.51.100.0/24;
    # deny  all;

    # Slow down credential guessing before it reaches Node. Pair with the
    # limit_req_zone directive in the http{} block (see deploy/README.md).
    location = /login {
        limit_req zone=studio_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Rebuilding the site after an approval takes a while.
        proxy_read_timeout 300s;
        client_max_body_size 4m;
    }
}
