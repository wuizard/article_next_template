# Rate limiting for the review panel's login form.
#
# `limit_req_zone` is only valid inside the http { } block. Debian, Ubuntu and
# RHEL all include /etc/nginx/conf.d/*.conf from there, so dropping this file
# in works without editing nginx.conf:
#
#   sudo cp deploy/nginx-ratelimit.conf /etc/nginx/conf.d/journal-ratelimit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The matching `limit_req` directive lives in the /login location block in
# nginx-journal.conf. Without this file, nginx fails to start with
# "unknown limit_req_zone".

# $binary_remote_addr is the client IP in binary form — 4 bytes for IPv4
# rather than up to 15 for the string form, so 10m tracks roughly 160,000
# addresses. 1m would be plenty here; the headroom costs nothing.
#
# rate=10r/m is a leaky bucket: one request every 6 seconds, not "10 then
# stop". The burst=5 in the location block absorbs a human mistyping their
# password a few times in a row.
limit_req_zone $binary_remote_addr zone=studio_login:10m rate=10r/m;

# nginx answers rate-limited requests with 503 by default, which reads as
# "the server is broken". 429 is the honest answer.
limit_req_status 429;

# Log when it triggers, so a brute-force attempt is visible in error.log
# rather than silent.
limit_req_log_level notice;
